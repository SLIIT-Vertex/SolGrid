name: solgrid-tests

services:
  mongo-test:
    image: mongo:7.0
    container_name: solgrid-mongo-test
    restart: unless-stopped
    ports:
      - "${MONGO_TEST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
